<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meetily — 智能会议纪要助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-stone-50: #FAF9F7;
            --color-stone-100: #F3F1ED;
            --color-stone-200: #E8E4DC;
            --color-stone-300: #D6D0C4;
            --color-stone-400: #A89F8C;
            --color-stone-500: #787165;
            --color-stone-600: #57534A;
            --color-stone-700: #44403A;
            --color-stone-800: #292522;
            --color-stone-900: #1C1917;
            --color-amber-50: #FFFBF0;
            --color-amber-100: #FFF3D6;
            --color-amber-200: #FFE089;
            --color-amber-300: #FFD046;
            --color-amber-400: #F5B400;
            --color-amber-500: #D99A00;
            --color-amber-600: #B37B00;
            --color-success: #10B981;
            --color-error: #EF4444;
            --color-info: #3B82F6;
            --font-display: 'Noto Serif SC', serif;
            --font-body: 'Inter', 'PingFang SC', sans-serif;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-xl: 0 8px 32px rgba(0,0,0,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            color: var(--color-stone-800);
            background: var(--color-stone-50);
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        /* 左侧品牌区 — 深暖色 */
        .brand-panel {
            background: linear-gradient(160deg, #2C241B 0%, #1a1612 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 56px 48px;
            position: relative;
            overflow: hidden;
        }

        .brand-panel::before {
            content: '';
            position: absolute;
            top: -120px;
            right: -120px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245,180,0,0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .brand-panel::after {
            content: '';
            position: absolute;
            bottom: -60px;
            left: -60px;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245,180,0,0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            z-index: 1;
        }

        .brand-logo-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--color-amber-400), var(--color-amber-500));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--color-stone-900);
        }

        .brand-logo-text {
            font-family: var(--font-display);
            font-size: 26px;
            font-weight: 700;
            color: var(--color-stone-50);
            letter-spacing: 0.02em;
        }

        .brand-tagline {
            position: relative;
            z-index: 1;
        }

        .brand-tagline h1 {
            font-family: var(--font-display);
            font-size: 48px;
            font-weight: 700;
            color: var(--color-stone-50);
            line-height: 1.25;
            margin-bottom: 24px;
            letter-spacing: -0.01em;
        }

        .brand-tagline p {
            font-size: 17px;
            color: var(--color-stone-400);
            line-height: 1.7;
            max-width: 360px;
        }

        .brand-features {
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .brand-feature {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--color-stone-400);
            font-size: 14px;
        }

        .brand-feature-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color-amber-400);
            flex-shrink: 0;
        }

        /* 右侧表单区 */
        .form-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
            position: relative;
            overflow-y: auto;
        }

        .form-wrapper {
            width: 100%;
            max-width: 380px;
        }

        .form-header {
            margin-bottom: 36px;
        }

        .form-header h2 {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 700;
            color: var(--color-stone-800);
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 15px;
            color: var(--color-stone-500);
        }

        /* 输入框 */
        .input-field {
            margin-bottom: 20px;
        }

        .input-field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--color-stone-600);
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .input-field input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid var(--color-stone-200);
            border-radius: var(--radius-md);
            font-size: 15px;
            font-family: var(--font-body);
            color: var(--color-stone-800);
            background: white;
            transition: all 0.2s ease-out;
            outline: none;
        }

        .input-field input::placeholder {
            color: var(--color-stone-400);
        }

        .input-field input:focus {
            border-color: var(--color-amber-400);
            box-shadow: 0 0 0 3px rgba(245,180,0,0.1);
        }

        /* 按钮 */
        .btn-primary {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            font-family: var(--font-body);
            cursor: pointer;
            transition: all 0.2s ease-out;
            background: var(--color-amber-400);
            color: var(--color-stone-900);
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: var(--color-amber-500);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(245,180,0,0.25);
        }

        .btn-primary:active { transform: translateY(0); }

        /* 分隔线 */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 28px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--color-stone-200);
        }

        .divider span {
            font-size: 13px;
            color: var(--color-stone-400);
        }

        /* 底部切换 */
        .form-switch {
            text-align: center;
            margin-top: 24px;
        }

        .form-switch p {
            font-size: 14px;
            color: var(--color-stone-500);
        }

        .form-switch a {
            color: var(--color-amber-600);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.15s;
        }

        .form-switch a:hover { color: var(--color-amber-500); }

        /* 表单切换动画 */
        .form-section {
            display: none;
            animation: fadeSlideIn 0.35s ease-out;
        }

        .form-section.active { display: block; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 消息提示 */
        .message {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            animation: fadeSlideIn 0.25s ease-out;
        }

        .message.show { display: block; }

        .message-error {
            background: #FEF2F2;
            color: var(--color-error);
            border: 1px solid #FECACA;
        }

        .message-success {
            background: #F0FDF4;
            color: var(--color-success);
            border: 1px solid #BBF7D0;
        }

        /* 响应式 */
        @media (max-width: 960px) {
            body { grid-template-columns: 1fr; }
            .brand-panel { display: none; }
            .form-panel { padding: 32px 24px; }
        }
    </style>
</head>
<body>

    <!-- 左侧品牌面板 -->
    <aside class="brand-panel">
        <div class="brand-logo">
            <div class="brand-logo-icon">会</div>
            <span class="brand-logo-text">Meetily</span>
        </div>

        <div class="brand-tagline">
            <h1>让每次会议<br>都有回响</h1>
            <p>智能语音识别、实时转写、AI 纪要提取。从对话到知识，一步到位。</p>
        </div>

        <div class="brand-features">
            <div class="brand-feature">
                <div class="brand-feature-dot"></div>
                <span>多人实时会议，&le;4 人浏览器直连</span>
            </div>
            <div class="brand-feature">
                <div class="brand-feature-dot"></div>
                <span>录音文件上传，离线也能生成纪要</span>
            </div>
            <div class="brand-feature">
                <div class="brand-feature-dot"></div>
                <span>知识库关联，AI 深度对话</span>
            </div>
            <div class="brand-feature">
                <div class="brand-feature-dot"></div>
                <span>自动归档，所有会议一目了然</span>
            </div>
        </div>
    </aside>

    <!-- 右侧表单面板 -->
    <main class="form-panel">
        <div class="form-wrapper">
            <!-- 登录 -->
            <section class="form-section active" id="loginSection">
                <div class="form-header">
                    <h2>欢迎回来</h2>
                    <p>登录以继续您的会议工作空间</p>
                </div>

                <div class="message message-error" id="loginError"></div>

                <div class="input-field">
                    <label for="loginUsername">用户名</label>
                    <input type="text" id="loginUsername" placeholder="输入您的用户名">
                </div>

                <div class="input-field">
                    <label for="loginPassword">密码</label>
                    <input type="password" id="loginPassword" placeholder="输入您的密码">
                </div>

                <button class="btn-primary" id="loginBtn">登 录</button>

                <div class="divider"><span>或</span></div>

                <div class="form-switch">
                    <p>还没有账号？<a id="toRegister">立即注册</a></p>
                </div>
            </section>

            <!-- 注册 -->
            <section class="form-section" id="registerSection">
                <div class="form-header">
                    <h2>创建账号</h2>
                    <p>加入 Meetily，让会议更高效</p>
                </div>

                <div class="message message-error" id="regError"></div>
                <div class="message message-success" id="regSuccess"></div>

                <div class="input-field">
                    <label for="regUsername">用户名</label>
                    <input type="text" id="regUsername" placeholder="3-20位，字母开头">
                </div>

                <div class="input-field">
                    <label for="regPassword">密码</label>
                    <input type="password" id="regPassword" placeholder="6-20位，含字母和数字">
                </div>

                <div class="input-field">
                    <label for="regConfirm">确认密码</label>
                    <input type="password" id="regConfirm" placeholder="再次输入密码">
                </div>

                <button class="btn-primary" id="regBtn">注 册</button>

                <div class="divider"><span>或</span></div>

                <div class="form-switch">
                    <p>已有账号？<a id="toLogin">立即登录</a></p>
                </div>
            </section>
        </div>
    </main>

    <script>
        // 表单切换
        const loginSection = document.getElementById('loginSection');
        const registerSection = document.getElementById('registerSection');
        const toRegister = document.getElementById('toRegister');
        const toLogin = document.getElementById('toLogin');

        toRegister.addEventListener('click', () => {
            loginSection.classList.remove('active');
            registerSection.classList.add('active');
            clearMessages();
        });

        toLogin.addEventListener('click', () => {
            registerSection.classList.remove('active');
            loginSection.classList.add('active');
            clearMessages();
        });

        function clearMessages() {
            document.querySelectorAll('.message').forEach(m => m.classList.remove('show'));
        }

        // 消息显示辅助
        function showMessage(elId, text) {
            const el = document.getElementById(elId);
            el.textContent = text;
            el.classList.add('show');
        }
    </script>
</body>
</html>
