<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智能会议纪要助手</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <h1>智能会议纪要助手</h1>
        <p class="subtitle">多人实时会议 · 语音转写 · 智能纪要</p>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <!-- 登录表单 -->
        <div id="loginForm" class="form-section active">
            <div class="input-group">
                <label for="loginUsername">用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名">
            </div>
            <div class="input-group">
                <label for="loginPassword">密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <button class="btn btn-primary" id="loginBtn">登录</button>
            <div class="toggle-text">
                还没有账号？<a id="toRegister">去注册</a>
            </div>
        </div>

        <!-- 注册表单 -->
        <div id="registerForm" class="form-section">
            <div class="input-group">
                <label for="regUsername">用户名</label>
                <input type="text" id="regUsername" placeholder="3-20位，字母开头，含字母数字下划线">
            </div>
            <div class="input-group">
                <label for="regPassword">密码</label>
                <input type="password" id="regPassword" placeholder="6-20位，含字母和数字">
            </div>
            <div class="input-group">
                <label for="regConfirm">确认密码</label>
                <input type="password" id="regConfirm" placeholder="再次输入密码">
            </div>
            <button class="btn btn-primary" id="registerBtn">注册</button>
            <div class="toggle-text">
                已有账号？<a id="toLogin">去登录</a>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
